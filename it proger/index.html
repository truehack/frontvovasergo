<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <!-- Вот эта строка подключает CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!---header-->
    <div class="top-bar"></div>
        <!---самый верхний блок-->
        <div class="green-block"></div>
            <div class="profile-icon">
                <svg xmlns="&#128197" width="24" height="24" viewBox="0 0 24 24" stroke="#000">
                </svg>
            </div>
            <div class="calendar-icon"></div>
        <!-- Блок с днями недели -->
        <div class="days-container">
    <div class="days-row">
        <div class="day-item today">
            <div class="day-name">ПН</div>
            <div class="day-number">1</div>
        </div>
        <div class="day-item">
            <div class="day-name">ВТ</div>
            <div class="day-number">2</div>
        </div>
        <div class="day-item">
            <div class="day-name">СР</div>
            <div class="day-number">3</div>
        </div>
        <div class="day-item">
            <div class="day-name">ЧТ</div>
            <div class="day-number">4</div>
        </div>
        <div class="day-item">
            <div class="day-name">ПТ</div>
            <div class="day-number">5</div>
        </div>
        <div class="day-item">
            <div class="day-name">СБ</div>
            <div class="day-number">6</div>
        </div>
        <div class="day-item">
            <div class="day-name">ВС</div>
            <div class="day-number">7</div>
        </div>
    </div>
</div>
    </div>


    <!-- Центральный блок -->
    <div class="main-bar">
        <!-- значок по центру -->
        <div class="centre-pin"></div>
        <div class="center-circle"></div>
        <!-- текстб под значком -->
        <div class="text1"><h3>Нет медикаментов на сегодня</h3><br><p>Следующее напоминание:</p><br><p>завтра, 3 окт., 14:00:</p></div>
    
    </div>

    <!-- нижний блок 
    <div class="foot-bar">
        <div class="footer-green-block"></div>
    <div class="days-row"></div>
        <div class="function"></div>
            <div id="function-icon1"></div>
            <div class="function-name">Расписание</div>
        </div>
         <div class="function"></div>
            <div id="function-icon2"></div>
            <div class="function-name">Добавить</div>
        </div>
         <div class="function"></div>
            <div id="function-icon3"></div>
            <div class="function-name">Напоминание</div>
        </div>
         <div class="function"></div>
            <div id="function-icon4"></div>
            <div class="function-name">Настройки</div>
        </div>
-->
    <div class="bottom-nav">
        <button class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
        </svg>
        <span>Расписание</span>
        </button>

        <button class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Добавить</span>
        </button>

        <button class="nav-item">
        <svg xmlns="http://  www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>Напоминания</span>
        </button>
        <!--поганый значок настроек-->
        <button class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.2">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
            <line x1="12" y1="4" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="20"/>
            <line x1="4" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="20" y2="12"/>
            <line x1="7.5" y1="7.5" x2="9" y2="9"/>
            <line x1="15" y1="15" x2="16.5" y2="16.5"/>
            <line x1="7.5" y1="16.5" x2="9" y2="15"/>
            <line x1="15" y1="9" x2="16.5" y2="7.5"/>
        </svg>
        <span>Настройки</span>
        </button>
    </div>

</body>
</html>
